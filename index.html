<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>For My Favorite Human 💖</title>
  <link rel="stylesheet" href="style.css">
  <!-- Background music placeholder: uncomment and set src to an mp3 file in the project 
  <audio id="bg-music" src="assets/music.mp3" loop preload="auto"></audio>
  -->
</head>
<body>
  <div class="bg-gradient"></div>
  <div id="particle-wrap" aria-hidden="true"></div>

  <main class="container">
    <section class="card" id="quiz-card" role="main" aria-live="polite">
      <div class="card-sparkles" aria-hidden="true"></div>

      <header class="card-header">
        <h1 class="title">For My SLP  💖</h1>
        <p class="subtitle">A very important relationship investigation 🕵️‍♂️💕</p>
      </header>

      <div class="progress-area" aria-hidden="false">
        <div class="progress-text" id="progress-text">0 / 10</div>
        <div class="progress-bar" aria-hidden="true">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="question-area">
        <div class="question" id="question-text">Loading...</div>
      </div>

      <div class="answers" id="answers">
        <button class="btn positive" id="btn-positive">Positive</button>
        <button class="btn negative" id="btn-negative">Negative</button>
        <div class="escape-msg" id="escape-msg" aria-hidden="true"></div>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>

    </section>

    <footer class="site-footer">Made with too much love and not enough seriousness 💕</footer>
  </main>

  <!-- Modal for virtual hug -->
  <div class="modal" id="hug-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <p>Virtual hug received successfully 💌</p>
      <button class="btn small" id="close-modal">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
